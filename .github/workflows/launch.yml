name: Launch checks
on: [push, pull_request, workflow_dispatch]
jobs:
  launch:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        id: old-python
        with:
          python-version: '3.9'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        env:
          SAYORI_TEST_OLD_PYTHON: ${{ steps.old-python.outputs.python-path }}
  brain-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/brain-browser" --no-save playwright@1.62.1
      - run: node tests/brain_ui.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/brain-browser/node_modules
          UI_SCREENSHOT_DIR: ${{ runner.temp }}/brain-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brain-ui-screenshots
          path: ${{ runner.temp }}/brain-ui/*.png
          if-no-files-found: ignore
